
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHESearch</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #101113;
    color: #e9e9e7;
    font-family: "Helvetica Neue", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
}

header {
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid rgba(255,255,255,0.07);
}

.logo {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 5px;
    color: #e7e4dc;
}

.logo span {
    color: #a99570;
}

.header-right {
    color: #777;
    font-size: 11px;
    letter-spacing: 2px;
}

main {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 60px 25px 100px;
    transform: translateY(-20px);
}

.brand {
    text-align: center;
    font-size: clamp(38px, 7vw, 66px);
    font-weight: 300;
    letter-spacing: 12px;
    margin-bottom: 18px;
}

.brand span {
    color: #b39b70;
}

.subtitle {
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: #686868;
    margin-bottom: 65px;
}

.search-box {
    width: 100%;
    height: 62px;
    border: 1px solid #414141;
    background: #171819;
    display: flex;
    align-items: center;
    padding: 0 22px;
    transition: 0.3s;
}

.search-box:focus-within {
    border-color: #a99570;
    box-shadow: 0 0 25px rgba(169,149,112,0.08);
}

.search-icon {
    color: #a99570;
    font-size: 20px;
    margin-right: 15px;
}

input {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #eee;
    font-size: 15px;
    letter-spacing: 1px;
    min-width: 0;
}

input::placeholder {
    color: #666;
}

.search-btn {
    border: none;
    background: transparent;
    color: #b39b70;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    padding: 12px 0 12px 15px;
}

.search-btn:hover {
    color: #fff;
}

.hint {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: #555;
    letter-spacing: 1px;
}

.result-area {
    margin-top: 38px;
}

.result-heading {
    display: none;
    font-size: 10px;
    letter-spacing: 3px;
    color: #777;
    padding-bottom: 15px;
    border-bottom: 1px solid #292929;
    margin-bottom: 15px;
}

.result-card {
    display: none;
    padding: 20px 22px;
    border: 1px solid #303030;
    background: #171819;
    cursor: pointer;
    transition: 0.25s;
    margin-bottom: 12px;
    animation: appear 0.4s ease;
}

.result-card:hover {
    border-color: #a99570;
    background: #1d1e1e;
    transform: translateY(-2px);
}

.result-name {
    font-size: 16px;
    color: #e6e1d7;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.result-url {
    font-size: 11px;
    color: #777;
    word-break: break-all;
}

.result-type {
    color: #a99570;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.result-arrow {
    float: right;
    color: #a99570;
    font-size: 18px;
    margin-top: -25px;
}

.error {
    display: none;
    color: #9b7777;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 20px 0;
}

.ad {
    display: none;
    margin-top: 30px;
    padding: 20px 23px;
    border: 1px solid rgba(169,149,112,0.45);
    background: linear-gradient(110deg, #1c1d1d, #191817);
    text-align: left;
    cursor: pointer;
    animation: appear 0.6s ease;
    transition: 0.25s;
}

.ad:hover {
    border-color: #b39b70;
    background: #22211e;
    transform: translateY(-2px);
}

.ad-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.ad-label {
    font-size: 9px;
    color: #9c8968;
    letter-spacing: 3px;
}

.ad-tag {
    font-size: 9px;
    color: #666;
    border: 1px solid #444;
    padding: 3px 7px;
}

.ad-title {
    font-size: 17px;
    letter-spacing: 3px;
    color: #e8e4dc;
    margin-bottom: 7px;
}

.ad-desc {
    color: #777;
    font-size: 11px;
    letter-spacing: 1px;
}

.ad-arrow {
    float: right;
    color: #b39b70;
    font-size: 20px;
    margin-top: -24px;
}

footer {
    width: 100%;
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    color: #454545;
    font-size: 10px;
    letter-spacing: 2px;
    border-top: 1px solid rgba(255,255,255,0.06);
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 600px) {
    header { padding: 0 20px; }
    .header-right { font-size: 9px; }
    .brand { letter-spacing: 7px; }
    .subtitle { letter-spacing: 2px; }
    footer { padding: 20px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">ASHES<span>Search</span></div>
    <div class="header-right">PRIVATE SEARCH SYSTEM</div>
</header>

<main>

    <div class="brand">ASHES<span>Search</span></div>
    <div class="subtitle">DISCOVER WHAT YOU ARE LOOKING FOR</div>

    <div class="search-box">
        <div class="search-icon">⌕</div>
        <input
            type="text"
            id="searchInput"
            placeholder="输入关键词，开始搜索..."
            autocomplete="off"
        >
        <button class="search-btn" onclick="search()">SEARCH ↗</button>
    </div>

    <div class="hint">ASHES SEARCH ENGINE · 只搜索你需要的信息</div>

    <div class="result-area">
        <div class="result-heading" id="resultHeading">
            SEARCH RESULTS
        </div>

        <div class="result-card" id="resultCard" onclick="openResult()">
            <div class="result-type">ASHESSEARCH · SEARCH RESULT</div>
            <div class="result-name" id="resultName"></div>
            <div class="result-url" id="resultUrl"></div>
            <div class="result-arrow">↗</div>
        </div>

        <div class="error" id="errorMessage">
            未找到相关结果 · NO RESULTS FOUND
        </div>
    </div>

    <div class="ad" id="phoneAd" onclick="openAd()">
        <div class="ad-top">
            <span class="ad-label">SPONSORED · 推荐内容</span>
            <span class="ad-tag">ADVERTISEMENT</span>
        </div>
        <div class="ad-title">手机追踪</div>
        <div class="ad-desc">查看设备相关信息 · 了解更多内容</div>
        <div class="ad-arrow">↗</div>
    </div>

</main>

<footer>
    <span>ASHES SEARCH</span>
    <span>© 2026 ASHESLOCK</span>
</footer>

<script>

const searchData = {
    "米瑞尔医院": "https://blackkeyjosana325-crypto.github.io/bhospitalmain/hospital",
    "四角洲行动": "https://blackkeyjosana325-crypto.github.io/bhospitalmain/fps",
    "Atock": "https://blackkeyjosana325-crypto.github.io/Atock/"
};

const adUrl =
"https://blackkeyjosana325-crypto.github.io/bhospitalmain/findphones";

let searchCount = 0;
let adShown = false;
let currentResultUrl = "";

function search() {

    const input = document.getElementById("searchInput");
    const keyword = input.value.trim();

    const resultCard = document.getElementById("resultCard");
    const resultHeading = document.getElementById("resultHeading");
    const errorMessage = document.getElementById("errorMessage");

    if (!keyword) {
        resultCard.style.display = "none";
        resultHeading.style.display = "none";
        errorMessage.style.display = "block";
        errorMessage.textContent = "请输入搜索关键词";
        return;
    }

    searchCount++;

    // 清除上一次的搜索结果
    resultCard.style.display = "none";
    errorMessage.style.display = "none";

    const matchedKey = Object.keys(searchData).find(
        key => key.toLowerCase() === keyword.toLowerCase()
    );

    if (matchedKey) {

        currentResultUrl = searchData[matchedKey];

        document.getElementById("resultName").textContent = matchedKey;
        document.getElementById("resultUrl").textContent = currentResultUrl;

        resultHeading.style.display = "block";
        resultCard.style.display = "block";

    } else {

        currentResultUrl = "";

        resultHeading.style.display = "block";
        errorMessage.style.display = "block";
        errorMessage.textContent =
            "未找到相关结果 · NO RESULTS FOUND";
    }

    // 搜索累计达到两次后显示广告
    if (searchCount >= 1) {
        showAd();
    }
}

function openResult() {
    if (currentResultUrl) {
        window.location.href = currentResultUrl;
    }
}

function showAd() {
    if (adShown) return;

    adShown = true;
    document.getElementById("phoneAd").style.display = "block";
}

function openAd() {
    window.location.href = adUrl;
}

// 支持回车搜索
document.getElementById("searchInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            search();
        }
    }
);

</script>

</body>
</html>
