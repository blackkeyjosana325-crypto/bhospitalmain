
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄驰雨的手机</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background: #e9e9ed;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.phone {
    width: 360px;
    height: 740px;
    background: #111;
    border: 8px solid #222;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 15px 45px rgba(0,0,0,.25);
}
.screen {
    width: 100%;
    height: 100%;
    background: #f6f6f8;
    position: relative;
    overflow: hidden;
}
.status {
    height: 34px;
    padding: 8px 20px 0;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #222;
    position: relative;
    z-index: 5;
}
.status-right {
    display: flex;
    gap: 6px;
}
#lockScreen {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: linear-gradient(155deg, #35435a, #111b2b 75%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 100px;
}
.lock-time {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 2px;
}
.lock-date {
    font-size: 16px;
    margin-top: 4px;
    color: #ddd;
}
.lock-owner {
    margin-top: 95px;
    font-size: 15px;
    letter-spacing: 3px;
}
.lock-input {
    margin-top: 22px;
    width: 220px;
    padding: 13px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 12px;
    background: rgba(255,255,255,.12);
    color: white;
    text-align: center;
    font-size: 17px;
    outline: none;
}
.lock-input::placeholder {
    color: #bbb;
}
.unlock-btn {
    margin-top: 15px;
    padding: 10px 42px;
    border: none;
    border-radius: 22px;
    background: white;
    color: #263348;
    font-size: 14px;
    cursor: pointer;
}
.lock-error {
    margin-top: 12px;
    font-size: 12px;
    color: #ffb8b8;
}
.home {
    display: none;
    height: 100%;
    background: linear-gradient(160deg, #e9edf4, #f6f6f8);
}
.home-header {
    padding: 28px 22px;
    font-size: 14px;
    color: #596273;
}
.home-header strong {
    display: block;
    font-size: 24px;
    color: #202a3a;
    margin-top: 7px;
}
.app-grid {
    display: flex;
    padding: 25px 24px;
}
.app {
    width: 75px;
    text-align: center;
    cursor: pointer;
}
.app-icon {
    width: 60px;
    height: 60px;
    border-radius: 17px;
    background: linear-gradient(145deg, #9a8af4, #6554c8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
    margin: auto;
    box-shadow: 0 5px 12px rgba(80,65,170,.25);
}
.app-name {
    font-size: 12px;
    color: #333;
    margin-top: 8px;
}
.dock {
    position: absolute;
    bottom: 18px;
    left: 18px;
    right: 18px;
    height: 75px;
    border-radius: 24px;
    background: rgba(255,255,255,.55);
}
.chat-app {
    display: none;
    position: absolute;
    inset: 0;
    background: #f6f6f8;
    flex-direction: column;
}
.chat-header {
    height: 58px;
    background: #fff;
    border-bottom: 1px solid #e9e9e9;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 12px;
    flex-shrink: 0;
}
.back {
    font-size: 25px;
    color: #333;
    cursor: pointer;
    padding-right: 5px;
}
.ai-avatar {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(145deg, #9b8cf3, #6656cc);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
}
.chat-title {
    font-size: 16px;
    font-weight: 600;
    color: #222;
}
.chat-subtitle {
    font-size: 10px;
    color: #999;
    margin-top: 3px;
}
.chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 12px;
}
.chat-date {
    text-align: center;
    color: #999;
    font-size: 11px;
    margin: 5px 0 25px;
}
.message-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 22px;
}
.message-row.user {
    flex-direction: row-reverse;
}
.message-avatar {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: white;
}
.user-avatar {
    background: #7d91a9;
}
.bot-avatar {
    background: linear-gradient(145deg, #9b8cf3, #6656cc);
}
.message-content {
    max-width: 245px;
}
.sender {
    font-size: 10px;
    color: #999;
    margin-bottom: 6px;
}
.user .sender {
    text-align: right;
}
.bubble {
    padding: 11px 13px;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.75;
    color: #252525;
    background: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    word-break: break-word;
}
.user .bubble {
    background: #d9e9ff;
}
.chat-time {
    text-align: center;
    font-size: 10px;
    color: #aaa;
    margin: 0 0 18px;
}
.chat-input {
    height: 62px;
    flex-shrink: 0;
    background: white;
    border-top: 1px solid #e9e9e9;
    display: flex;
    align-items: center;
    padding: 0 13px;
    gap: 10px;
}
.input-fake {
    flex: 1;
    height: 37px;
    border-radius: 20px;
    background: #f2f2f4;
    color: #aaa;
    font-size: 12px;
    display: flex;
    align-items: center;
    padding-left: 14px;
}
.send-icon {
    color: #8b7be5;
    font-size: 22px;
}
.home-indicator {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 4px;
    border-radius: 5px;
    background: #222;
    z-index: 20;
}
.chat-app .home-indicator {
    background: #333;
}
@media (max-width: 400px) {
    body { background: #111; }
    .phone {
        width: 100vw;
        height: 100vh;
        border: none;
        border-radius: 0;
    }
}
</style>
</head>
<body>

<div class="phone">
<div class="screen">

    <!-- 锁屏 -->
    <div id="lockScreen">
        <div class="lock-time">19:00</div>
        <div class="lock-date">8月22日 星期六</div>
        <div class="lock-owner">黄驰雨</div>
        <input id="password" class="lock-input" type="password"
               placeholder="请输入锁屏密码"
               onkeydown="if(event.key==='Enter') unlock()">
        <button class="unlock-btn" onclick="unlock()">解锁手机</button>
        <div class="lock-error" id="error"></div>
    </div>

    <!-- 桌面 -->
    <div class="home" id="home">
        <div class="status">
            <span>19:00</span>
            <div class="status-right">
                <span>5G</span><span>▮▮▮</span><span>🔋</span>
            </div>
        </div>
        <div class="home-header">
            我的手机
            <strong>黄驰雨</strong>
        </div>

        <div class="app-grid">
            <div class="app" onclick="openChat()">
                <div class="app-icon">豆</div>
                <div class="app-name">豆沙包</div>
            </div>
        </div>
        <div class="dock"></div>
    </div>

    <!-- AI聊天界面 -->
    <div class="chat-app" id="chatApp">
        <div class="status">
            <span>19:00</span>
            <div class="status-right">
                <span>5G</span><span>▮▮▮</span><span>🔋</span>
            </div>
        </div>

        <div class="chat-header">
            <div class="back" onclick="backHome()">‹</div>
            <div class="ai-avatar">豆</div>
            <div>
                <div class="chat-title">豆沙包</div>
                <div class="chat-subtitle">AI智能助手 · 正在为你服务</div>
            </div>
        </div>

        <div class="chat-body">
            <div class="chat-date">8月22日 19:00</div>

            <div class="message-row user">
                <div class="message-avatar user-avatar">黄</div>
                <div class="message-content">
                    <div class="sender">黄驰雨</div>
                    <div class="bubble">
                        我现在在我爸妈家门口，听到了家里传来了一些动静……我现在怀疑，我喜欢的人可能是我同父异母的妹妹，怎么办？
                    </div>
                </div>
            </div>

            <div class="chat-time">19:00</div>

            <div class="message-row">
                <div class="message-avatar bot-avatar">豆</div>
                <div class="message-content">
                    <div class="sender">豆沙包</div>
                    <div class="bubble">
                        我以最直白，最简洁，最不绕弯子的语言告诉你，如果你确实想确定心中的疑惑，请和她进行一次亲子鉴定。
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-fake">发消息给豆沙包……</div>
            <div class="send-icon">➤</div>
        </div>
    </div>

    <div class="home-indicator"></div>
</div>
</div>

<script>
function unlock() {
    const pwd = document.getElementById("password").value;
    if (pwd === "20020818") {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("home").style.display = "block";
        document.getElementById("error").innerText = "";
    } else {
        document.getElementById("error").innerText = "密码错误，请重试";
    }
}

function openChat() {
    document.getElementById("home").style.display = "none";
    document.getElementById("chatApp").style.display = "flex";
}

function backHome() {
    document.getElementById("chatApp").style.display = "none";
    document.getElementById("home").style.display = "block";
}
</script>

</div>
</body>
</html>
